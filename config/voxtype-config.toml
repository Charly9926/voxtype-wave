# Voxtype configuration for push-to-talk dictation through a GNOME custom shortcut.
# Copy to: ~/.config/voxtype/config.toml

state_file = "auto"

# Top-level key: it must come before any [table] header.
engine = "parakeet"

[hotkey]
# The shortcut is handled by GNOME (F9 -> `voxtype record toggle`), so Voxtype's
# own device listener stays off.
enabled = false
key = "F9"
mode = "toggle"

[audio]
device = "default"            # follows PipeWire's default source (virtual mics included)
sample_rate = 16000
max_duration_secs = 120
pause_media = false

[audio.feedback]
enabled = true                # beep when recording starts and stops
volume = 0.7

[parakeet]
model = "parakeet-tdt-0.6b-v3-int8"   # int8: 670 MB. Use "parakeet-tdt-0.6b-v3" for fp32
model_type = "tdt"
on_demand_loading = true              # load while dictating, release afterwards

[output]
# Clipboard output plus a dotool hook: Voxtype's "paste" mode cannot send the
# paste chord on GNOME, since it only accepts wtype/eitype/ydotool for that.
mode = "clipboard"
restore_clipboard = false
driver_order = ["dotool", "ydotool", "clipboard"]
fallback_to_clipboard = true
auto_submit = false
post_output_command = "sleep 0.2; echo 'key ctrl+shift+v' | dotool"

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[text]
# spoken_punctuation and the filler-word list are English-only.
spoken_punctuation = false
filter_filler_words = true

[vad]
enabled = true                # drop silence-only recordings
backend = "energy"
threshold = 0.4

[osd]
enabled = false               # the GNOME extension replaces Voxtype's own OSD
